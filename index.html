<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4">
                    <form id="regForm">
                        <div class="mb-3">
                            <label class="label-text">Логин / почта</label>
                            <input type="email" id="login" class="form-control" required placeholder="user@example.com">
                        </div>

                        <div class="mb-3 position-relative">
                            <label class="label-text">Пароль (минимум 12 символов)</label>
                            <input type="password" id="password" class="form-control" required placeholder="••••••••••••">
                            <div id="passwordStrength" class="form-text mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label class="label-text">Повторите пароль</label>
                            <input type="password" id="passwordRepeat" class="form-control" required placeholder="••••••••••••">
                        </div>

                        <div id="errorMessage" class="alert alert-danger d-none"></div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Зарегистрировать</button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text">Уже есть аккаунт? </small>
                        <a href="login.html" class="text-primary fw-semibold text-decoration-none">
                            Войти
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('passwordStrength');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let text = '';
            let color = '';

            if (val.length < 12) {
                text = '❌ Слишком короткий (минимум 12 символов)';
                color = 'text-danger';
            } else if (!/[A-Z]/.test(val)) {
                text = '❌ Отсутствует заглавная буква';
                color = 'text-danger';
            } else if (!/\d/.test(val)) {
                text = '❌ Отсутствует цифра';
                color = 'text-danger';
            } else if (!/[!@#$%^&*(),.?":{}|<>]/.test(val)) {
                text = '❌ Отсутствует спец. символ (!@#$%^&*)';
                color = 'text-danger';
            } else {
                text = '✅ Пароль надёжный';
                color = 'text-success';
            }

            strengthBar.innerHTML = text;
            strengthBar.className = `form-text mt-1 ${color}`;
        });

        document.getElementById('regForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const login = document.getElementById('login').value.trim();
            const pass = document.getElementById('password').value;
            const passRepeat = document.getElementById('passwordRepeat').value;

            if (pass !== passRepeat) {
                document.getElementById('errorMessage').textContent = '❌ Пароли не совпадают!';
                document.getElementById('errorMessage').classList.remove('d-none');
                return;
            }
            document.getElementById('errorMessage').classList.add('d-none');

            if (pass.length < 12 || !/[A-Z]/.test(pass) || !/\d/.test(pass) || !/[!@#$%^&*(),.?":{}|<>]/.test(pass)) {
                document.getElementById('errorMessage').textContent = '❌ Пароль не соответствует требованиям!';
                document.getElementById('errorMessage').classList.remove('d-none');
                return;
            }
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
