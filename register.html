<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style_dark.css" id="themeStylesheet">
    <script>
        // Apply saved theme before the page renders (prevents a flash of the wrong theme)
        (function () {
            var theme = 'dark';
            try { theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
            if (theme === 'light') {
                document.getElementById('themeStylesheet').href = 'style_light.css';
            }
        })();
    </script>
</head>
<body>
    <button type="button" id="themeToggle" class="theme-toggle">☀️ Светлая</button>

    <div class="form-container">
        <div class="logo">Регистрация</div>

        <form id="registerForm">
            <!-- Логин / Почта -->
            <div class="form-group">
                <label for="login">Логин / Почта</label>
                <input type="text" id="login" placeholder="Введите логин или почту" required>
                <div class="error" id="loginError"></div>
            </div>

            <!-- Пароль -->
            <div class="form-group">
                <label for="password">Пароль (минимум 12 символов)</label>
                <input type="password" id="password" placeholder="Придумайте пароль" required>
                <div class="error" id="passwordError"></div>
            </div>

            <!-- Повторный пароль -->
            <div class="form-group">
                <label for="confirmPassword">Повторный пароль</label>
                <input type="password" id="confirmPassword" placeholder="Подтвердите пароль" required>
                <div class="error" id="confirmError"></div>
            </div>

            <!-- Две кнопки с одним классом -->
            <div class="buttons-group">
                <button type="submit" class="button">Зарегистрироваться</button>
                <button type="button" class="button">Войти</button>
            </div>
        </form>

        <!-- Блок успеха -->
        <div id="successBlock" class="success">
            ✅ Регистрация прошла успешно!<br>
            <small>Вы будете перенаправлены на главную страницу</small>
        </div>
    </div>

    <script>
        const loginInput = document.getElementById('login');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const loginError = document.getElementById('loginError');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        const successBlock = document.getElementById('successBlock');
        const form = document.getElementById('registerForm');

        // Проверка логина (простая: не пустой)
        loginInput.addEventListener('input', () => {
            if (loginInput.value.trim() === '') {
                loginError.textContent = 'Поле не может быть пустым';
                loginError.classList.add('show');
            } else {
                loginError.classList.remove('show');
            }
        });

        // Проверка пароля (регламент)
        function validatePassword(pass) {
            if (pass.length < 12) {
                passwordError.textContent = 'Пароль должен содержать минимум 12 символов';
                return false;
            }
            if (!/[A-Z]/.test(pass)) {
                passwordError.textContent = 'Пароль должен содержать хотя бы одну заглавную букву';
                return false;
            }
            if (!/[0-9]/.test(pass)) {
                passwordError.textContent = 'Пароль должен содержать хотя бы одну цифру';
                return false;
            }
            if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pass)) {
                passwordError.textContent = 'Пароль должен содержать хотя бы один специальный символ (!@#$%^&*()_+-=[]{};\':"\\|,.<>/?)';
                return false;
            }
            return true;
        }

        passwordInput.addEventListener('input', () => {
            if (validatePassword(passwordInput.value)) {
                passwordError.classList.remove('show');
            } else {
                passwordError.classList.add('show');
            }
        });

        // Проверка совпадения паролей
        function checkPasswordsMatch() {
            if (confirmInput.value.trim() === passwordInput.value.trim() && passwordInput.value.trim() !== '') {
                confirmError.textContent = 'Пароли совпадают ✅';
                confirmError.style.color = 'var(--success-text)';
                return true;
            } else {
                confirmError.textContent = 'Пароли не совпадают';
                confirmError.style.color = 'var(--error)';
                return false;
            }
        }

        confirmInput.addEventListener('input', checkPasswordsMatch);

        // Обработка отправки формы
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const isPasswordValid = validatePassword(passwordInput.value);
            const passwordsMatch = checkPasswordsMatch();

            // Показываем ошибки, если есть
            if (!isPasswordValid) passwordError.classList.add('show');
            if (!passwordsMatch) confirmError.classList.add('show');

            // Если всё ок
            if (isPasswordValid && passwordsMatch && loginInput.value.trim() !== '') {
                // Показываем блок успеха
                successBlock.style.display = 'block';

                // Переход на локальный файл menu.html
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1500);
            }
        });

        // Кнопка «Войти» — переход на авторизацию
        document.querySelector('.buttons-group .button:last-child').addEventListener('click', () => {
            window.location.href = 'auth.html';
        });

        // ===== Theme switch =====
        const themeLink = document.getElementById('themeStylesheet');
        const themeToggle = document.getElementById('themeToggle');

        function applyTheme(theme) {
            themeLink.href = theme === 'light' ? 'style_light.css' : 'style_dark.css';
            themeToggle.textContent = theme === 'light' ? '🌙 Тёмная' : '☀️ Светлая';
            try { localStorage.setItem('theme', theme); } catch (e) {}
        }

        let currentTheme = 'dark';
        try { currentTheme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
        applyTheme(currentTheme);

        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);
        });
    </script>
</body>
</html>
